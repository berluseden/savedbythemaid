<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350">
  <!-- Píldora amarilla de fondo -->
  <ellipse cx="250" cy="175" rx="230" ry="130" fill="#FFD700"/>
  
  <!-- Texto "eco" en cursiva con borde azul y relleno blanco -->
  <text x="80" y="230" font-family="'Brush Script MT', cursive, serif" font-size="160" font-style="italic" font-weight="bold" fill="white" stroke="#00205B" stroke-width="8" paint-order="stroke">eco</text>
  
  <!-- Hoja verde sobre la "e" -->
  <ellipse cx="145" cy="135" rx="22" ry="35" fill="#90EE90" transform="rotate(-25 145 135)"/>
  <path d="M 138 125 Q 150 145 145 165" stroke="#228B22" stroke-width="3" fill="none"/>
  
  <!-- "911" debajo de eco -->
  <text x="280" y="300" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#00205B">911</text>
  
  <!-- Texto "Maid" en azul oscuro -->
  <text x="480" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="180" font-weight="bold" fill="#00205B">Maid</text>
  
  <!-- Burbujas azules arriba de la "i" -->
  <!-- Burbuja pequeña arriba -->
  <circle cx="780" cy="90" r="22" fill="#00205B"/>
  <ellipse cx="774" cy="83" rx="6" ry="8" fill="white" opacity="0.4"/>
  
  <!-- Burbuja mediana derecha -->
  <circle cx="820" cy="110" r="18" fill="#00205B"/>
  <ellipse cx="815" cy="105" rx="5" ry="6" fill="white" opacity="0.4"/>
  
  <!-- Burbuja grande abajo -->
  <circle cx="795" cy="145" r="28" fill="#00205B"/>
  <ellipse cx="787" cy="136" rx="8" ry="10" fill="white" opacity="0.4"/>
  
  <!-- Chispa dorada -->
  <g transform="translate(740, 110)">
    <path d="M0 -12 L0 12 M-12 0 L12 0" stroke="#FFD700" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-8 -8 L8 8 M8 -8 L-8 8" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
