services:
  mysql:
    image: mysql:8.4-lts
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: STPmn4ccf5XnVGz0QExvs15q
      MYSQL_DATABASE: savedbythemaid
      MYSQL_USER: app_user
      MYSQL_PASSWORD: rU07izZNgJPnTX0H8AxoCAYA
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=savedbythemaid;User=app_user;Password=rU07izZNgJPnTX0H8AxoCAYA;"
      Jwt__Secret: bcm4CLy28blqT0Vii20wGCf59yVPgulSZ15xsDj7gj9Zesqk
      ASPNETCORE_ENVIRONMENT: Production
      Email__Provider: Resend
      Email__Resend__ApiKey: re_4wMhSqWM_94GxFMREUWRdebx9zfM9UMTX
      AdminSeed__Email: julendy20@gmail.com
      AdminSeed__Password: Jb10852011.!
    volumes:
      - dp_keys:/app/dataprotection-keys
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  mysql_data:
  dp_keys:

networks:
  app-network:
