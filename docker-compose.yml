version: '3.8'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-savedbythemaid}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./SavedByTheMaid.New
      dockerfile: src/SavedByTheMaid.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-savedbythemaid};User=${MYSQL_USER:-app_user};Password=${MYSQL_PASSWORD};
      JwtSettings__Secret: ${JWT_SECRET}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${API_PORT:-5000}:8080"

  frontend:
    build:
      context: ./SavedByTheMaid.New/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./SavedByTheMaid.New/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mysql_data:
